<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=845, initial-scale=1.0">
<title>Ad Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 845px; height: 314px; overflow: hidden; background: #000; }
  #player { position: relative; width: 845px; height: 314px; background: #000; }
  .slide {
    position: absolute; top: 0; left: 0;
    width: 845px; height: 314px;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
  }
  .slide.visible { opacity: 1; }
  .slide img { width: 845px; height: 314px; object-fit: cover; display: block; }
  .slide video { width: 845px; height: 314px; object-fit: cover; display: block; background: #000; }
  #error { display: none; color: #fff; font-family: sans-serif; font-size: 14px; text-align: center; padding-top: 140px; }
  /* Camera beacon — 8px, top-right. Invisible from the court, readable from a ceiling cam. */
  #beacon {
    position: absolute; top: 0; right: 0;
    width: 8px; height: 8px;
    display: none;
    z-index: 9999;
  }
</style>
</head>
<body>
<div id="player">
  <div id="error">Could not load ads.json</div>
  <div id="beacon"></div>
</div>
<script>
(function() {
"use strict";

// ═══════════════════════════════════════════════════════════════════
//  CONFIG — the only block you should need to edit per board
// ═══════════════════════════════════════════════════════════════════
var BOARD_ID = 1;              // CHANGE PER BOARD (1-16)

var ADS_FOLDER = "ads/";
var DEFAULT_IMAGE_DURATION = 10;
var LOAD_TIMEOUT_MS = 8000;
var PRELOAD_AHEAD = 2;

// Health / recovery
var WATCHDOG_INTERVAL  = 10000;   // check every 10s
var WATCHDOG_MAX_STUCK = 30000;   // no advance in 30s -> recover
var SECONDARY_STUCK_MS = 45000;   // backstop if the watchdog itself dies

// ads.json refresh. Was a one-shot setTimeout at 4h — now a real interval.
var ADS_REFRESH_MS = 15 * 60 * 1000;
var ADS_JSON_CACHE_BUCKET_SECONDS = 60;   // all boards share one CF cache hit

// Full page reload once nightly, when nobody is looking. Clears any
// webview memory creep that a soft refresh can't touch. -1 disables.
var NIGHTLY_RELOAD_HOUR = 4;

// Clock sync across all 16 boards. Uses the server Date header (corrected
// for CF cache Age) instead of trusting the Taurus RTC. false = use local clock.
var USE_SERVER_TIME = true;
var MAX_SANE_OFFSET_MS = 6 * 60 * 60 * 1000;  // ignore absurd corrections

// Optional monitoring. Empty string = fully disabled, zero requests.
var MONITOR_URL = "";          // e.g. "https://levelup-monitor.s-jackson.workers.dev/beat"
var MONITOR_INTERVAL_MS = 60000;

// Optional camera beacon for detecting a dark panel.
var BEACON_ENABLED = false;

// Spotty-wifi protection.
var LS_ADS_KEY = "levelup_ads_json";       // last good ads.json, kept on the device
var PREFETCH_TIMEOUT_MS = 20000;           // per image, when warming every ad into memory
var PREFETCH_RETRY_MS   = 60000;           // retry images that failed to download
var RELOAD_RETRY_MS     = 15 * 60 * 1000;  // nightly reload waits for the network

// ═══════════════════════════════════════════════════════════════════

var player  = document.getElementById("player");
var errorEl = document.getElementById("error");

var adList = [];
var currentEl = null;
var currentKey = null;          // "index:file" — guards against redundant re-renders
var advanceTimer = null;
var loadTimer = null;
var watchdogTimer = null;
var cycleLength = 0;
var offsets = [];
var imageCache = {};
var lastAdsJson = null;
var lastAdvanceTime = Date.now();
var recoveries = 0;
var lastError = null;
var timeOffsetMs = 0;
var playing = false;            // true once the first slide has been scheduled
var prefetchRun = 0;
var prefetchRetryTimer = null;

function log()  { if (window.console) console.log.apply(console, arguments); }
function warn() { if (window.console) console.warn.apply(console, arguments); }

// ─── Clock ──────────────────────────────────────────────────────────
// Every slot boundary is derived from this, so all 16 boards flip in
// lockstep as long as they agree on the time.
function nowMs()  { return Date.now() + timeOffsetMs; }
function nowSec() { return Math.floor(nowMs() / 1000); }

function syncClock(xhr, requestSentAt) {
  if (!USE_SERVER_TIME) return;
  try {
    var dateHeader = xhr.getResponseHeader("Date");
    if (!dateHeader) return;
    var serverMs = Date.parse(dateHeader);
    if (isNaN(serverMs)) return;

    // A cached ads.json carries the ORIGINAL Date header. Cloudflare sends
    // Age telling us how stale it is — without this correction the clock
    // would lag by up to a full cache bucket.
    var age = parseInt(xhr.getResponseHeader("Age") || "0", 10);
    if (!isNaN(age) && age > 0) serverMs += age * 1000;

    // Date headers are whole seconds, so assume mid-second, and add half
    // the round trip to account for flight time.
    serverMs += 500 + Math.round((Date.now() - requestSentAt) / 2);

    var offset = serverMs - Date.now();
    if (Math.abs(offset) > MAX_SANE_OFFSET_MS) {
      warn("Ignoring implausible clock offset:", offset);
      return;
    }
    if (Math.abs(offset - timeOffsetMs) > 1000) {
      log("Clock offset " + timeOffsetMs + "ms -> " + offset + "ms");
      timeOffsetMs = offset;
    }
  } catch (e) { /* clock sync is best-effort, never fatal */ }
}

// ─── HTTP (XHR, not fetch — older Taurus webviews) ──────────────────
function getJSON(url, timeoutMs, onOk, onFail) {
  var xhr = new XMLHttpRequest();
  var sentAt = Date.now();
  var done = false;

  xhr.open("GET", url, true);
  xhr.timeout = timeoutMs;
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4 || done) return;
    done = true;
    if (xhr.status >= 200 && xhr.status < 300) {
      syncClock(xhr, sentAt);
      try { onOk(JSON.parse(xhr.responseText)); }
      catch (e) { onFail("parse error"); }
    } else {
      onFail("HTTP " + xhr.status);
    }
  };
  xhr.ontimeout = function() { if (!done) { done = true; onFail("timeout"); } };
  xhr.onerror   = function() { if (!done) { done = true; onFail("network"); } };
  xhr.send();
}

// ─── Ad list helpers ────────────────────────────────────────────────
function isVideo(f) { return /\.(mp4|webm)$/i.test(f); }

// Optional "from" and "until" on an entry, as YYYY-MM-DD, both inclusive.
// Dates use the board's local clock. Entries without them always run.
function inDateWindow(item) {
  if (!item.from && !item.until) return true;
  var d = new Date();
  var mm = ("0" + (d.getMonth() + 1)).slice(-2);
  var dd = ("0" + d.getDate()).slice(-2);
  var today = d.getFullYear() + "-" + mm + "-" + dd;
  if (item.from && today < item.from) return false;
  if (item.until && today > item.until) return false;
  return true;
}

// Group members can be a plain file name or {file, from, until, enabled}. Members that
// are switched off or outside their window are left out; a group with none left is skipped.
function activeEntries(ads) {
  var out = [];
  for (var i = 0; i < ads.length; i++) {
    var e = ads[i];
    if (e.enabled === false || !inDateWindow(e)) continue;
    if (!e.rotate) { out.push(e); continue; }
    var files = [];
    for (var j = 0; j < e.files.length; j++) {
      var m = e.files[j];
      if (typeof m === "string") files.push(m);
      else if (m.enabled !== false && inDateWindow(m)) files.push(m.file);
    }
    if (!files.length) continue;
    var copy = {};
    for (var k in e) copy[k] = e[k];
    copy.files = files;
    out.push(copy);
  }
  return out;
}

function getSlotDuration(item) {
  if (item.rotate) return item.duration || DEFAULT_IMAGE_DURATION;
  return isVideo(item.file) ? (item.duration || 30)
                            : (item.duration || DEFAULT_IMAGE_DURATION);
}

// Resolved for a SPECIFIC time, so preloads pick the file that will
// actually be on screen rather than the one showing right now.
function resolveFileAt(item, atSec) {
  if (!item.rotate) return item.file;
  if (!cycleLength) return item.files[0];
  var cycle = Math.floor(atSec / cycleLength);
  return item.files[((cycle % item.files.length) + item.files.length) % item.files.length];
}
function resolveFile(item) { return resolveFileAt(item, nowSec()); }

function buildOffsets() {
  cycleLength = 0;
  offsets = [];
  for (var i = 0; i < adList.length; i++) {
    offsets.push(cycleLength);
    cycleLength += getSlotDuration(adList[i]);
  }
  if (cycleLength <= 0) cycleLength = DEFAULT_IMAGE_DURATION;
}

function getCurrentIndex() {
  if (!adList.length || !cycleLength) return 0;
  var pos = nowSec() % cycleLength;
  for (var i = offsets.length - 1; i >= 0; i--) {
    if (pos >= offsets[i]) return i;
  }
  return 0;
}

function getMsRemaining(index) {
  if (!cycleLength) return 1000;
  var pos = nowSec() % cycleLength;
  var elapsed = pos - offsets[index];
  return Math.max((getSlotDuration(adList[index]) - elapsed) * 1000, 500);
}

function secondsUntil(index) {
  if (!cycleLength) return 0;
  var d = offsets[index] - (nowSec() % cycleLength);
  return d < 0 ? d + cycleLength : d;
}

function clearTimers() {
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  if (loadTimer)    { clearTimeout(loadTimer);    loadTimer = null; }
}

// Any .slide that isn't the live one is orphaned DOM. On a board running
// 16h/day a few stragglers per hour add up.
function pruneSlides() {
  var slides = player.querySelectorAll(".slide");
  for (var i = 0; i < slides.length; i++) {
    if (slides[i] !== currentEl) {
      var v = slides[i].querySelector("video");
      if (v) { v.pause(); v.removeAttribute("src"); v.load(); }
      if (slides[i].parentNode) slides[i].parentNode.removeChild(slides[i]);
    }
  }
}

// ─── Recovery ───────────────────────────────────────────────────────
function forceRecovery(reason) {
  warn("Recovery:", reason);
  recoveries++;
  lastError = reason;
  clearTimers();
  currentEl = null;
  currentKey = null;
  pruneSlides();                 // imageCache deliberately preserved
  lastAdvanceTime = Date.now();
  checkAndAdvance(true);
}

function startWatchdog() {
  if (watchdogTimer) clearInterval(watchdogTimer);
  watchdogTimer = setInterval(function() {
    var stuck = Date.now() - lastAdvanceTime;
    if (stuck > WATCHDOG_MAX_STUCK) {
      forceRecovery("stuck " + Math.round(stuck / 1000) + "s");
    }
  }, WATCHDOG_INTERVAL);
}

// Backstop in case the watchdog interval itself gets killed
setInterval(function() {
  if (!adList.length) return;
  if (Date.now() - lastAdvanceTime > SECONDARY_STUCK_MS) {
    forceRecovery("secondary check");
  }
}, 15000);

document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "visible" && adList.length) {
    forceRecovery("visibilitychange");
  }
});
window.addEventListener("online", function() {
  log("Network back");
  refreshAdsJson();
  prefetchAll();
  if (adList.length) forceRecovery("network restored");
});
window.addEventListener("pageshow", function(e) {
  if (e.persisted && adList.length) forceRecovery("bfcache restore");
});

// ─── Preload ────────────────────────────────────────────────────────
function preloadUpcoming(currentIndex) {
  for (var i = 1; i <= PRELOAD_AHEAD; i++) {
    var nextIdx = (currentIndex + i) % adList.length;
    var file = resolveFileAt(adList[nextIdx], nowSec() + secondsUntil(nextIdx));
    if (!imageCache[file] && !isVideo(file)) {
      var img = new Image();
      img.src = ADS_FOLDER + encodeURIComponent(file);
      imageCache[file] = img;
    }
  }
}

function getOrLoadImage(file, onLoad, onError) {
  var src = ADS_FOLDER + encodeURIComponent(file);
  var cached = imageCache[file];
  if (cached && cached.complete && cached.naturalWidth > 0) { onLoad(cached); return; }

  var img = cached || new Image();
  imageCache[file] = img;
  img.onload  = function() { onLoad(img); };
  img.onerror = function() { delete imageCache[file]; onError(); };
  if (!img.src) img.src = src;
}

// ─── Saved copy of ads.json ─────────────────────────────────────────
// Lets the board start from the last good ad list when ads.json can't be fetched.
function saveAds(data) {
  try { localStorage.setItem(LS_ADS_KEY, JSON.stringify({ t: Date.now(), data: data })); }
  catch (e) { /* storage is best-effort */ }
}
function readSavedAds() {
  try {
    var o = JSON.parse(localStorage.getItem(LS_ADS_KEY) || "null");
    if (o && o.data && o.data.ads && o.data.ads.length) return o.data;
  } catch (e) {}
  return null;
}

function isGoodImage(img) { return !!(img && img.complete && img.naturalWidth > 0); }

// ─── Warm every ad into memory ──────────────────────────────────────
// Downloads every active image (including every member of a rotating group)
// once, one at a time, and keeps it. After that a wifi dip can't blank a slot,
// because nothing on screen needs the network any more.
function prefetchAll() {
  var run = ++prefetchRun;
  if (prefetchRetryTimer) { clearTimeout(prefetchRetryTimer); prefetchRetryTimer = null; }
  var queue = [], seen = {}, failed = 0;
  for (var i = 0; i < adList.length; i++) {
    var files = adList[i].rotate ? adList[i].files : [adList[i].file];
    for (var j = 0; j < files.length; j++) {
      var f = files[j];
      if (seen[f] || isVideo(f)) continue;
      seen[f] = true;
      var c = imageCache[f];
      if (isGoodImage(c)) continue;                 // already in memory
      if (c && !c.complete) continue;               // already downloading
      queue.push(f);
    }
  }
  function next() {
    if (run !== prefetchRun) return;                // a newer run took over
    if (!queue.length) {
      if (failed) prefetchRetryTimer = setTimeout(prefetchAll, PREFETCH_RETRY_MS);
      return;
    }
    var file = queue.shift();
    if (isGoodImage(imageCache[file])) { next(); return; }
    var img = new Image(), settled = false;
    var timer = setTimeout(function() { finish(false); }, PREFETCH_TIMEOUT_MS);
    function finish(ok) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (!ok) { failed++; if (imageCache[file] === img) delete imageCache[file]; }
      next();
    }
    img.addEventListener("load",  function() { finish(true); });
    img.addEventListener("error", function() { finish(false); });
    imageCache[file] = img;
    img.src = ADS_FOLDER + encodeURIComponent(file);
  }
  next();
}

// Something to show when the scheduled ad can't be loaded and the board
// would otherwise be black: any ad that is already in memory.
function showFallbackSlide() {
  if (currentEl) return;
  var keys = Object.keys(imageCache);
  for (var i = 0; i < keys.length; i++) {
    var img = imageCache[keys[i]];
    if (!isGoodImage(img)) continue;
    var div = document.createElement("div");
    div.className = "slide visible";
    var el = document.createElement("img");
    el.src = img.src;
    div.appendChild(el);
    player.appendChild(div);
    currentEl = div;
    currentKey = null;
    return;
  }
}

// ─── Rendering ──────────────────────────────────────────────────────
function showSlide(index) {
  clearTimers();
  lastAdvanceTime = Date.now();

  var item = adList[index];
  if (!item) { advanceTimer = setTimeout(function(){ checkAndAdvance(true); }, 1000); return; }

  var file = resolveFile(item);
  currentKey = index + ":" + file;

  if (isVideo(file)) {
    if (currentEl) {
      var oldVid = currentEl.querySelector("video");
      if (oldVid) { oldVid.pause(); oldVid.removeAttribute("src"); oldVid.load(); }
      if (currentEl.parentNode) currentEl.parentNode.removeChild(currentEl);
      currentEl = null;
    }
    pruneSlides();

    var div = document.createElement("div");
    div.className = "slide";
    var vid = document.createElement("video");
    vid.src = ADS_FOLDER + encodeURIComponent(file);
    vid.muted = true;
    vid.playsInline = true;
    vid.setAttribute("playsinline", "");
    vid.preload = "auto";
    // Looping instead of advancing on "ended" — a video shorter than its
    // declared slot used to fire "ended", re-enter the same slot, and
    // restart in a tight loop. Advancing is now purely clock-driven.
    vid.loop = true;

    var vidTimer = setTimeout(function() {
      warn("Video load timeout:", file);
      lastError = "video timeout: " + file;
      checkAndAdvance(true);
    }, LOAD_TIMEOUT_MS);

    vid.addEventListener("canplay", function() {
      clearTimeout(vidTimer);
      div.classList.add("visible");
      var p = vid.play();
      if (p && p["catch"]) p["catch"](function() { checkAndAdvance(true); });
    });
    vid.addEventListener("error", function() {
      clearTimeout(vidTimer);
      warn("Video error:", file);
      lastError = "video error: " + file;
      checkAndAdvance(true);
    });

    div.appendChild(vid);
    player.appendChild(div);
    currentEl = div;
    preloadUpcoming(index);
    advanceTimer = setTimeout(function(){ checkAndAdvance(true); }, getMsRemaining(index));
    return;
  }

  loadTimer = setTimeout(function() {
    warn("Image load timeout:", file);
    lastError = "image timeout: " + file;
    delete imageCache[file];
    showFallbackSlide();
    checkAndAdvance(true);
  }, LOAD_TIMEOUT_MS);

  getOrLoadImage(file, function(img) {
    clearTimeout(loadTimer); loadTimer = null;

    var div = document.createElement("div");
    div.className = "slide";
    var imgEl = document.createElement("img");
    imgEl.src = img.src;
    div.appendChild(imgEl);
    player.appendChild(div);

    requestAnimationFrame(function() {
      requestAnimationFrame(function() { div.classList.add("visible"); });
    });

    if (currentEl) {
      var old = currentEl;
      setTimeout(function() {
        old.classList.remove("visible");
        setTimeout(function() {
          if (old.parentNode) old.parentNode.removeChild(old);
        }, 350);
      }, 50);
    }

    currentEl = div;
    preloadUpcoming(index);
    advanceTimer = setTimeout(function(){ checkAndAdvance(true); }, getMsRemaining(index));

  }, function() {
    clearTimeout(loadTimer); loadTimer = null;
    warn("Image error:", file);
    lastError = "image error: " + file;
    showFallbackSlide();
    // Was 500ms: with the wifi down that hammered a slow player twice a second.
    advanceTimer = setTimeout(function(){ checkAndAdvance(true); }, 3000);
  });
}

// force=false means "only re-render if the slot actually changed". Timers
// that fire a few ms early used to re-render the same slide, restarting
// the fade and flashing the board.
function checkAndAdvance(force) {
  clearTimers();
  if (!adList.length) return;

  var index = getCurrentIndex();
  var key = index + ":" + resolveFile(adList[index]);

  if (!force && key === currentKey && currentEl) {
    lastAdvanceTime = Date.now();
    advanceTimer = setTimeout(function(){ checkAndAdvance(true); }, getMsRemaining(index));
    return;
  }
  showSlide(index);
}

// ─── ads.json ───────────────────────────────────────────────────────
function getAdsCacheKey() {
  return Math.floor(Date.now() / (ADS_JSON_CACHE_BUCKET_SECONDS * 1000));
}
function adsUrl() { return "ads/ads.json?v=" + getAdsCacheKey(); }

function applyAdsData(data) {
  var active = activeEntries(data.ads);
  if (!active.length) return false;   // nothing in its window: keep playing what we have
  var newJson = JSON.stringify(active);
  if (newJson === lastAdsJson) return false;

  log("ads.json changed, rebuilding");
  lastAdsJson = newJson;
  adList = active;
  buildOffsets();

  var keep = {};
  for (var i = 0; i < adList.length; i++) {
    var files = adList[i].rotate ? adList[i].files : [adList[i].file];
    for (var j = 0; j < files.length; j++) keep[files[j]] = true;
  }
  var keys = Object.keys(imageCache);
  for (var k = 0; k < keys.length; k++) {
    if (!keep[keys[k]]) delete imageCache[keys[k]];
  }
  return true;
}

function refreshAdsJson() {
  getJSON(adsUrl(), 8000, function(data) {
    if (!data.ads || !data.ads.length) return;   // keep playing what we have
    saveAds(data);
    if (applyAdsData(data)) { checkAndAdvance(true); prefetchAll(); }
  }, function(err) {
    warn("ads.json refresh failed (non-fatal):", err);
  });
}
setInterval(refreshAdsJson, ADS_REFRESH_MS);

function loadAds() {
  getJSON(adsUrl(), 8000, function(data) {
    if (!data.ads || !data.ads.length) { scheduleRetry("empty"); return; }
    if (!activeEntries(data.ads).length) { scheduleRetry("no ads in their date window"); return; }
    loadAds._retryDelay = null;
    saveAds(data);
    lastError = null;
    if (playing) {
      // Already running from the saved copy: just switch to the fresh list.
      errorEl.style.display = "none";
      if (applyAdsData(data)) checkAndAdvance(true);
      prefetchAll();
      return;
    }
    startWith(data);
  }, function(err) { scheduleRetry(err); });
}

// Begin playback from an ad list (fresh from the network, or the saved copy).
function startWith(data) {
    playing = true;
    applyAdsData(data);
    errorEl.style.display = "none";

    var started = false;
    function tryStart() {
      if (started) return;
      started = true;
      // Align the first flip to a whole second so boards start in phase
      setTimeout(function() {
        checkAndAdvance(true);
        startWatchdog();
      }, 1000 - (nowMs() % 1000));
    }

    var loaded = 0;
    var current = getCurrentIndex();
    adList.forEach(function(ad, i) {
      var file = resolveFile(ad);
      if (isVideo(file)) {
        loaded++;
        if (loaded === adList.length) tryStart();
        return;
      }
      var img = new Image();
      img.onload = img.onerror = function() {
        loaded++;
        if (i === current || loaded === adList.length) tryStart();
      };
      img.src = ADS_FOLDER + encodeURIComponent(file);
      imageCache[file] = img;
    });

    setTimeout(tryStart, 3000);   // never block on a slow asset
    setTimeout(prefetchAll, 4000);  // then warm every other ad in the background
}

function scheduleRetry(err) {
  warn("ads.json load failed:", err);
  lastError = "ads.json: " + err;
  if (!playing) {
    // No network at start-up: play the last good ad list instead of an error.
    var saved = readSavedAds();
    if (saved && activeEntries(saved.ads).length) startWith(saved);
  }
  if (!playing) errorEl.style.display = "block";
  var delay = loadAds._retryDelay = Math.min((loadAds._retryDelay || 7500) * 2, 60000);
  log("Retrying ads.json in " + (delay / 1000) + "s");
  setTimeout(loadAds, delay);
}

// ─── Nightly reload ─────────────────────────────────────────────────
function scheduleNightlyReload() {
  if (NIGHTLY_RELOAD_HOUR < 0) return;
  var now = new Date(nowMs());
  var target = new Date(now.getTime());
  target.setHours(NIGHTLY_RELOAD_HOUR, 0, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  var ms = target.getTime() - now.getTime();
  log("Nightly reload in " + Math.round(ms / 3600000) + "h");
  setTimeout(reloadWhenReachable, ms);
}

// A reload with the wifi down would leave the board on a dead page until
// someone fixed it by hand. So ask the server first, and wait if it is silent.
function reloadWhenReachable() {
  var done = false;
  function later() { if (done) return; done = true; setTimeout(reloadWhenReachable, RELOAD_RETRY_MS); }
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "index.html?probe=" + Date.now(), true);
    xhr.timeout = 10000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4 || done) return;
      if (xhr.status >= 200 && xhr.status < 300) { done = true; location.reload(); }
      else later();
    };
    xhr.ontimeout = later;
    xhr.onerror = later;
    xhr.send();
  } catch (e) { later(); }
}

// ─── Monitoring ─────────────────────────────────────────────────────
function beat() {
  if (!MONITOR_URL) return;
  try {
    var idx = adList.length ? getCurrentIndex() : -1;
    var payload = JSON.stringify({
      board: BOARD_ID,
      layer: "ads",
      ts: nowMs(),
      stuckMs: Date.now() - lastAdvanceTime,
      slide: idx >= 0 ? resolveFile(adList[idx]) : null,
      ads: adList.length,
      recoveries: recoveries,
      clockOffsetMs: timeOffsetMs,
      lastError: lastError
    });
    var xhr = new XMLHttpRequest();
    xhr.open("POST", MONITOR_URL, true);
    xhr.setRequestHeader("Content-Type", "text/plain");  // avoids CORS preflight
    xhr.send(payload);
  } catch (e) { /* monitoring must never break playback */ }
}
if (MONITOR_URL) setInterval(beat, MONITOR_INTERVAL_MS);

// ─── Camera beacon ──────────────────────────────────────────────────
if (BEACON_ENABLED) {
  var beaconEl = document.getElementById("beacon");
  beaconEl.style.display = "block";
  setInterval(function() {
    beaconEl.style.background = "hsl(" + ((nowMs() / 50) % 360) + ",100%,50%)";
  }, 100);
}

// ─── Offline copy of the page and ads (service worker) ──────────────
// Lets the board start with no wifi at all. Ignored where unsupported.
try {
  if ("serviceWorker" in navigator) {
    var swp = navigator.serviceWorker.register("sw.js");
    if (swp && swp["catch"]) swp["catch"](function() {});
  }
} catch (e) {}

// Add ?diag=1 to the board's URL to show what this player supports.
try {
  if (/[?&]diag=1\b/.test(location.search || "")) {
    var diagBox = document.createElement("div");
    diagBox.style.cssText = "position:absolute;top:4px;left:4px;z-index:20000;background:#000;color:#7CFC00;" +
      "font:13px/1.4 monospace;padding:6px 10px;border:1px solid #7CFC00;white-space:pre-wrap;";
    player.appendChild(diagBox);
    var diagReport = function() {
      var ua = navigator.userAgent || "", m = /Chrome\/(\d+)/.exec(ua);
      var sw = ("serviceWorker" in navigator);
      var ls = "no";
      try { localStorage.setItem("levelup_diag", "1"); localStorage.removeItem("levelup_diag"); ls = "yes"; } catch (e) {}
      var total = 0, good = 0, seen = {};
      for (var i = 0; i < adList.length; i++) {
        var files = adList[i].rotate ? adList[i].files : [adList[i].file];
        for (var j = 0; j < files.length; j++) {
          if (seen[files[j]]) continue;
          seen[files[j]] = true; total++;
          if (isGoodImage(imageCache[files[j]])) good++;
        }
      }
      diagBox.textContent =
        "BROWSER: " + (m ? "Chrome " + m[1] : "unknown") + "\n" +
        "OFFLINE COPY SUPPORTED: " + (sw ? "yes" : "no") + "\n" +
        "OFFLINE COPY ACTIVE: " + (sw && navigator.serviceWorker.controller ? "yes" : "no (reload once more)") + "\n" +
        "DEVICE STORAGE WORKS: " + ls + "\n" +
        "AD LIST SAVED ON DEVICE: " + (readSavedAds() ? "yes" : "no") + "\n" +
        "ADS IN MEMORY: " + good + " of " + total + "\n" +
        "LAST ERROR: " + (lastError || "none");
    };
    diagReport();
    setInterval(diagReport, 2000);
  }
} catch (e) {}

// ─── Init ───────────────────────────────────────────────────────────
loadAds();
scheduleNightlyReload();

})();
</script>
</body>
</html>
